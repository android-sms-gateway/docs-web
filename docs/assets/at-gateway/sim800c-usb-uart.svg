<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 610" role="img" aria-label="SIM800C wired to a USB-UART adapter">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0969da"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#cf222e"/>
    </marker>
    <g id="gnd-sym">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#57606a" stroke-width="2"/>
      <line x1="-10" y1="10" x2="10" y2="10" stroke="#57606a" stroke-width="2"/>
      <line x1="-6" y1="15" x2="6" y2="15" stroke="#57606a" stroke-width="2"/>
      <line x1="-2" y1="20" x2="2" y2="20" stroke="#57606a" stroke-width="2"/>
    </g>
    <style>
      .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
      .ttl { font: 700 14px system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #1f2328; }
      .sub { font: 11px system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #57606a; }
      .pin { font: 600 11px system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #1f2328; }
      .note { font: 11px system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #57606a; }
      .title { font: 700 17px system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #1f2328; }
    </style>
  </defs>

  <rect x="0" y="0" width="840" height="610" fill="#ffffff"/>
  <text x="420" y="52" text-anchor="middle" class="title">SIM800C + USB-UART adapter</text>

  <!-- Host -->
  <rect x="20" y="130" width="150" height="170" rx="8" class="box"/>
  <text x="95" y="188" text-anchor="middle" class="ttl">Host</text>
  <text x="95" y="208" text-anchor="middle" class="sub">runs AT Gateway</text>
  <line x1="170" y1="240" x2="220" y2="240" stroke="#57606a" stroke-width="2.5"/>
  <rect x="188" y="237" width="14" height="6" rx="2" fill="#57606a"/>
  <text x="195" y="228" text-anchor="middle" class="sub">USB</text>

  <!-- USB-UART adapter -->
  <rect x="220" y="130" width="200" height="220" rx="8" class="box"/>
  <text x="320" y="158" text-anchor="middle" class="ttl">USB-UART bridge</text>
  <text x="320" y="176" text-anchor="middle" class="sub">CP2102 · CH340 · FT232</text>
  <text x="320" y="192" text-anchor="middle" class="sub">I/O level = 3.3 V</text>
  <circle cx="420" cy="240" r="4" fill="#1f2328"/>
  <text x="412" y="234" text-anchor="end" class="pin">TXD</text>
  <circle cx="420" cy="285" r="4" fill="#1f2328"/>
  <text x="412" y="279" text-anchor="end" class="pin">RXD</text>
  <circle cx="420" cy="330" r="4" fill="#1f2328"/>
  <text x="412" y="324" text-anchor="end" class="pin">GND</text>

  <!-- SIM800C -->
  <rect x="580" y="130" width="210" height="370" rx="8" class="box"/>
  <text x="685" y="156" text-anchor="middle" class="ttl">SIM800C module</text>
  <circle cx="580" cy="240" r="4" fill="#1f2328"/>
  <text x="594" y="244" class="pin">TX</text>
  <circle cx="580" cy="285" r="4" fill="#1f2328"/>
  <text x="594" y="289" class="pin">RX</text>
  <circle cx="580" cy="330" r="4" fill="#1f2328"/>
  <text x="594" y="334" class="pin">GND</text>
  <circle cx="580" cy="385" r="4" fill="#1f2328"/>
  <text x="594" y="389" class="pin">VCC</text>
  <circle cx="580" cy="460" r="4" fill="#1f2328"/>
  <text x="594" y="464" class="pin">PWRKEY</text>
  <rect x="645" y="415" width="95" height="34" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="692" y="436" text-anchor="middle" class="sub">SIM card</text>
  <line x1="790" y1="200" x2="812" y2="200" stroke="#57606a" stroke-width="2"/>
  <circle cx="817" cy="200" r="4" fill="none" stroke="#57606a" stroke-width="2"/>
  <text x="815" y="182" text-anchor="end" class="sub">Antenna</text>

  <!-- Data wires (TX to RX, crossed) -->
  <line x1="420" y1="240" x2="580" y2="285" stroke="#0969da" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="580" y1="240" x2="420" y2="285" stroke="#0969da" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- GND wire -->
  <line x1="420" y1="330" x2="580" y2="330" stroke="#57606a" stroke-width="2"/>

  <!-- Dedicated power supply -->
  <rect x="250" y="360" width="220" height="90" rx="8" class="box"/>
  <text x="360" y="390" text-anchor="middle" class="ttl">Dedicated supply</text>
  <text x="360" y="410" text-anchor="middle" class="sub">3.4–4.4 V, ≥ 2 A (GSM burst)</text>
  <text x="360" y="428" text-anchor="middle" class="sub">not the adapter's 3.3 V pin</text>
  <circle cx="470" cy="385" r="4" fill="#cf222e"/>
  <line x1="470" y1="385" x2="580" y2="385" stroke="#cf222e" stroke-width="2" marker-end="url(#arrow-red)"/>
  <circle cx="450" cy="360" r="4" fill="#57606a"/>
  <line x1="450" y1="360" x2="450" y2="330" stroke="#57606a" stroke-width="2" stroke-dasharray="5,4"/>
  <circle cx="450" cy="330" r="3.5" fill="#57606a"/>

  <!-- PWRKEY button to ground -->
  <line x1="580" y1="460" x2="525" y2="460" stroke="#57606a" stroke-width="2"/>
  <circle cx="525" cy="460" r="4" fill="#ffffff" stroke="#1f2328" stroke-width="2"/>
  <circle cx="495" cy="460" r="4" fill="#ffffff" stroke="#1f2328" stroke-width="2"/>
  <line x1="523" y1="458" x2="499" y2="446" stroke="#1f2328" stroke-width="2"/>
  <line x1="495" y1="460" x2="475" y2="460" stroke="#57606a" stroke-width="2"/>
  <use href="#gnd-sym" transform="translate(475,460)"/>
  <text x="515" y="435" text-anchor="middle" class="sub">hold ≈1 s</text>

  <!-- Notes -->
  <text x="20" y="546" class="note">• Power the module from a dedicated supply — never feed VCC from the adapter's 3.3 V pin.</text>
  <text x="20" y="568" class="note">• 3.3 V logic only: the SIM800C UART is rated 2.8 V — never drive 5 V into TX or VCC.</text>
  <text x="20" y="590" class="note">• Insert the SIM card and attach the antenna first, then hold PWRKEY ≈1 s to power on.</text>
</svg>
